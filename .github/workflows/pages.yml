name: Deploy Algorithmic Activism Reader to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export fresh dataset & assemble site
        run: |
          python3 export_dataset.py
          mkdir -p _site
          cp web/index.html _site/index.html
          cp dataset.jsonl _site/dataset.jsonl

      - name: Sync dataset to Hugging Face Hub
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_file(
              path_or_fileobj="dataset.jsonl",
              path_in_repo="dataset.jsonl",
              repo_id="hardtoneselector/algorithmic-activism-corpus",
              repo_type="dataset",
              commit_message="ci: sync dataset.jsonl (automated corpus update)",
          )
          print("Hugging Face commit:", info.oid)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
