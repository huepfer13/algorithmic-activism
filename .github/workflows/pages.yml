name: Deploy Algorithmic Activism Reader to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'menschenrechte_tales/**'
      - 'web/**'
      - 'menschenrechte_books/**'
      - 'export_dataset.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-hf-sync"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export fresh dataset & assemble site
        run: |
          python3 export_dataset.py
          mkdir -p _site
          # GANZES web/ ausliefern: index.html UND ui-locales.json (i18n-Woerterbuch).
          # Vorher wurde nur index.html kopiert -> ui-locales.json lief auf Pages in einen 404.
          cp -r web/. _site/
          # Die Kapiteltexte liegen NICHT unter web/: der Reader holt sie relativ zur Wurzel.
          # Ohne diesen Schritt waeren alle Buecher auf Pages 404.
          cp -r menschenrechte_books _site/
          cp dataset.jsonl _site/dataset.jsonl

      - name: Sync dataset to Hugging Face Hub
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_file(
              path_or_fileobj="dataset.jsonl",
              path_in_repo="dataset.jsonl",
              repo_id="hardtoneselector/algorithmic-activism-corpus",
              repo_type="dataset",
              commit_message="ci: sync dataset.jsonl (automated corpus update)",
          )
          print("Hugging Face commit:", info.oid)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
