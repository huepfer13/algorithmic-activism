<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithmic Activism — Synthetischer Menschenrechte-Korpus</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --tag-bg: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 380px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: #0b1120; }
    .header { padding: 16px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.15rem; color: var(--accent); margin-bottom: 4px; }
    .header p { font-size: 0.8rem; color: var(--muted); }
    .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-direction: column; }
    input, select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    #tales-list { flex: 1; overflow-y: auto; padding: 8px; }
    .tale-item { padding: 12px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; background: var(--card-bg); border: 1px solid transparent; transition: all 0.15s; }
    .tale-item:hover { border-color: var(--accent); }
    .tale-item.active { border-color: var(--accent); background: #1e3a5f; }
    .tale-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .tale-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    #main-content { flex: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
    .reader { max-width: 780px; width: 100%; }
    .provenance { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.8rem; }
    .provenance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .pro-item span { color: var(--muted); display: block; font-size: 0.7rem; text-transform: uppercase; }
    .pro-item b { color: var(--text); }
    .article-body { line-height: 1.7; font-size: 1.05rem; }
    .article-body h1, .article-body h2 { margin-bottom: 16px; color: var(--accent); }
    .article-body p { margin-bottom: 16px; }
    .empty-state { color: var(--muted); margin-top: 100px; text-align: center; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="header">
      <h1>Algorithmic Activism</h1>
      <p id="stats-summary">Korpus wird geladen...</p>
    </div>
    <div class="search-box">
      <input type="text" id="filter-input" placeholder="Titel, Text oder Modell suchen...">
      <div style="display: flex; gap: 6px;">
        <select id="style-select" style="flex: 1;"><option value="">Alle Stile</option></select>
        <select id="article-select" style="flex: 1;"><option value="">Alle Artikel</option></select>
      </div>
    </div>
    <div id="tales-list"></div>
  </aside>

  <main id="main-content">
    <div class="reader" id="reader-view">
      <div class="empty-state">Wähle eine Geschichte aus der linken Leiste aus.</div>
    </div>
  </main>

  <script>
    let tales = [];
    // Mehrere Kandidaten: GitHub Pages (neben der Seite), lokaler Server (web/.. oder datasets/)
    const DATASET_CANDIDATES = ['./dataset.jsonl', '../dataset.jsonl', '../datasets/corpus-latest.jsonl'];

    async function loadDataset() {
      try {
        let res = null, used = null;
        for (const url of DATASET_CANDIDATES) {
          const r = await fetch(url, {cache: 'no-store'});
          if (r.ok) { res = r; used = url; break; }
        }
        if (!res) throw new Error("Dataset nicht erreichbar: " + DATASET_CANDIDATES.join(', '));
        const text = await res.text();
        const lines = text.trim().split("\n");
        tales = lines.map(line => JSON.parse(line)).filter(r => r.meta);
        
        document.getElementById('stats-summary').textContent = `${tales.length} Narrative synthetisiert (Zero-Dependency)`;
        populateFilters();
        renderList(tales);
        if (tales.length > 0) selectTale(0);
      } catch (e) {
        document.getElementById('stats-summary').textContent = "Fehler beim Laden von dataset.jsonl";
        console.error(e);
      }
    }

    function populateFilters() {
      const styles = [...new Set(tales.map(t => t.meta.style).filter(Boolean))].sort();
      const articles = [...new Set(tales.map(t => t.meta.article).filter(Boolean))].sort();
      
      const styleSelect = document.getElementById('style-select');
      styles.forEach(s => styleSelect.innerHTML += `<option value="${s}">${s}</option>`);

      const artSelect = document.getElementById('article-select');
      articles.forEach(a => artSelect.innerHTML += `<option value="${a}">${a}</option>`);
    }

    function renderList(list) {
      const container = document.getElementById('tales-list');
      container.innerHTML = '';
      list.forEach((t, index) => {
        const item = document.createElement('div');
        item.className = 'tale-item';
        item.innerHTML = `
          <div class="tale-title">${t.meta.title || t.output.split('\n')[0].replace('# ', '')}</div>
          <div class="tale-meta">
            <span class="tag">${t.meta.article || 'UDHR'}</span>
            <span class="tag">${t.meta.style || 'Narrative'}</span>
            <span class="tag">${t.meta.language || 'DE'}</span>
          </div>
        `;
        item.onclick = () => {
          document.querySelectorAll('.tale-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          selectTale(tales.indexOf(t));
        };
        container.appendChild(item);
      });
    }

    function selectTale(index) {
      const t = tales[index];
      if (!t) return;
      const htmlContent = marked.parse(t.output);
      const auditPassed = t.meta.guardrail_audit?.passed ?? true;
      
      document.getElementById('reader-view').innerHTML = `
        <div class="provenance">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Provenienz & Prüfstatus</strong>
            <span style="color: ${auditPassed ? '#4ade80' : '#f87171'}; font-weight:bold;">
              ${auditPassed ? '✓ Audit Passed' : '⚠ Quarantäne'}
            </span>
          </div>
          <div class="provenance-grid">
            <div class="pro-item"><span>UN-Artikel</span><b>${t.meta.article || 'N/A'}</b></div>
            <div class="pro-item"><span>Stil</span><b>${t.meta.style || 'N/A'}</b></div>
            <div class="pro-item"><span>Modell</span><b>${t.meta.model || 'N/A'}</b></div>
            <div class="pro-item"><span>Wörter</span><b>~${t.meta.approx_words || 'N/A'}</b></div>
          </div>
        </div>
        <div class="article-body">${htmlContent}</div>
      `;
    }

    function filterData() {
      const q = document.getElementById('filter-input').value.toLowerCase();
      const style = document.getElementById('style-select').value;
      const art = document.getElementById('article-select').value;

      const filtered = tales.filter(t => {
        const matchQ = !q || (t.output.toLowerCase().includes(q) || (t.meta.title && t.meta.title.toLowerCase().includes(q)));
        const matchStyle = !style || t.meta.style === style;
        const matchArt = !art || t.meta.article === art;
        return matchQ && matchStyle && matchArt;
      });
      renderList(filtered);
    }

    document.getElementById('filter-input').addEventListener('input', filterData);
    document.getElementById('style-select').addEventListener('change', filterData);
    document.getElementById('article-select').addEventListener('change', filterData);

    window.onload = loadDataset;
  </script>
</body>
</html>
